<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Tiling Islamic geometric lattice — cream lines on transparent (overlays forest-green bg) -->
  <!-- Base: 8-pointed star lattice tile, 120x120 repeat -->

  <!-- Central 8-pointed star -->
  <g transform="translate(60,60)" fill="none" stroke="#F5F0E8" stroke-width="0.8" opacity="0.18">
    <!-- Outer octagon -->
    <polygon points="0,-28 19.8,-19.8 28,0 19.8,19.8 0,28 -19.8,19.8 -28,0 -19.8,-19.8"/>
    <!-- Inner square -->
    <polygon points="0,-20 20,0 0,20 -20,0"/>
    <!-- Rotated inner square -->
    <polygon points="0,-20 20,0 0,20 -20,0" transform="rotate(45)"/>
    <!-- Centre dot -->
    <circle cx="0" cy="0" r="4"/>
  </g>

  <!-- Corner quarter-stars (appear as full stars when tiled) -->
  <!-- Top-left corner -->
  <g transform="translate(0,0)" fill="none" stroke="#F5F0E8" stroke-width="0.8" opacity="0.18">
    <polygon points="0,-28 19.8,-19.8 28,0 19.8,19.8 0,28 -19.8,19.8 -28,0 -19.8,-19.8"/>
    <polygon points="0,-20 20,0 0,20 -20,0"/>
    <polygon points="0,-20 20,0 0,20 -20,0" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="4"/>
  </g>
  <!-- Top-right corner -->
  <g transform="translate(120,0)" fill="none" stroke="#F5F0E8" stroke-width="0.8" opacity="0.18">
    <polygon points="0,-28 19.8,-19.8 28,0 19.8,19.8 0,28 -19.8,19.8 -28,0 -19.8,-19.8"/>
    <polygon points="0,-20 20,0 0,20 -20,0"/>
    <polygon points="0,-20 20,0 0,20 -20,0" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="4"/>
  </g>
  <!-- Bottom-left corner -->
  <g transform="translate(0,120)" fill="none" stroke="#F5F0E8" stroke-width="0.8" opacity="0.18">
    <polygon points="0,-28 19.8,-19.8 28,0 19.8,19.8 0,28 -19.8,19.8 -28,0 -19.8,-19.8"/>
    <polygon points="0,-20 20,0 0,20 -20,0"/>
    <polygon points="0,-20 20,0 0,20 -20,0" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="4"/>
  </g>
  <!-- Bottom-right corner -->
  <g transform="translate(120,120)" fill="none" stroke="#F5F0E8" stroke-width="0.8" opacity="0.18">
    <polygon points="0,-28 19.8,-19.8 28,0 19.8,19.8 0,28 -19.8,19.8 -28,0 -19.8,-19.8"/>
    <polygon points="0,-20 20,0 0,20 -20,0"/>
    <polygon points="0,-20 20,0 0,20 -20,0" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="4"/>
  </g>

  <!-- Mid-edge stars (left, right, top, bottom) -->
  <g transform="translate(0,60)" fill="none" stroke="#F5F0E8" stroke-width="0.8" opacity="0.18">
    <polygon points="0,-28 19.8,-19.8 28,0 19.8,19.8 0,28 -19.8,19.8 -28,0 -19.8,-19.8"/>
    <polygon points="0,-20 20,0 0,20 -20,0"/>
    <polygon points="0,-20 20,0 0,20 -20,0" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="4"/>
  </g>
  <g transform="translate(120,60)" fill="none" stroke="#F5F0E8" stroke-width="0.8" opacity="0.18">
    <polygon points="0,-28 19.8,-19.8 28,0 19.8,19.8 0,28 -19.8,19.8 -28,0 -19.8,-19.8"/>
    <polygon points="0,-20 20,0 0,20 -20,0"/>
    <polygon points="0,-20 20,0 0,20 -20,0" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="4"/>
  </g>
  <g transform="translate(60,0)" fill="none" stroke="#F5F0E8" stroke-width="0.8" opacity="0.18">
    <polygon points="0,-28 19.8,-19.8 28,0 19.8,19.8 0,28 -19.8,19.8 -28,0 -19.8,-19.8"/>
    <polygon points="0,-20 20,0 0,20 -20,0"/>
    <polygon points="0,-20 20,0 0,20 -20,0" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="4"/>
  </g>
  <g transform="translate(60,120)" fill="none" stroke="#F5F0E8" stroke-width="0.8" opacity="0.18">
    <polygon points="0,-28 19.8,-19.8 28,0 19.8,19.8 0,28 -19.8,19.8 -28,0 -19.8,-19.8"/>
    <polygon points="0,-20 20,0 0,20 -20,0"/>
    <polygon points="0,-20 20,0 0,20 -20,0" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="4"/>
  </g>

  <!-- Connecting lattice lines between stars -->
  <g stroke="#F5F0E8" stroke-width="0.6" opacity="0.12">
    <!-- Horizontal connectors -->
    <line x1="28" y1="60" x2="32" y2="60"/>
    <line x1="88" y1="60" x2="92" y2="60"/>
    <!-- Vertical connectors -->
    <line x1="60" y1="28" x2="60" y2="32"/>
    <line x1="60" y1="88" x2="60" y2="92"/>
    <!-- Diagonal connectors at 45deg for lattice feel -->
    <line x1="20" y1="20" x2="32" y2="32"/>
    <line x1="100" y1="20" x2="88" y2="32"/>
    <line x1="20" y1="100" x2="32" y2="88"/>
    <line x1="100" y1="100" x2="88" y2="88"/>
  </g>
</svg>
