    <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#C9A84C" opacity="0.85"/>
    <polygon points="0,-13 3.5,-3.5 13,0 3.5,3.5 0,13 -3.5,3.5 -13,0 -3.5,-3.5" fill="#C9A84C" opacity="0.5" transform="rotate(22.5)"/>
    <circle cx="0" cy="0" r="4" fill="#C9A84C" opacity="0.6"/>
  </g>
  <!-- diamond connector -->
  <rect x="62" y="26" width="8" height="8" transform="rotate(45,66,30)" fill="#C9A84C" opacity="0.25"/>

