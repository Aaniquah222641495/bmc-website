<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" preserveAspectRatio="xMidYMid meet" fill="none">
  <!-- Horizontal thin rules framing the band -->
  <line x1="0" y1="5" x2="800" y2="5" stroke="#C9A84C" stroke-width="0.75" opacity="0.5"/>
  <line x1="0" y1="55" x2="800" y2="55" stroke="#C9A84C" stroke-width="0.75" opacity="0.5"/>

  <!-- Repeating eight-pointed star units, spaced 80px apart -->
  <!-- Star unit macro: inner square rotated 45deg + outer square = 8-pointed star -->

  <!-- Unit at x=40 -->
