# Place this file at the ROOT of the repo (next to package.json / pnpm-workspace.yaml)

[build]
  # Netlify runs its own `pnpm install` first (it detects pnpm-lock.yaml).
  # TINA_CLIENT_ID is only set once a Tina Cloud project exists (see
  # artifacts/bmc-website/TINA.md); until then this skips straight to the
  # plain Vite build so the site keeps deploying, just without /admin.
  #
  # --skip-cloud-checks: the deploy webhook and Tina Cloud's re-index of the
  # branch race each other, so a schema change (e.g. adding a field type) fails
  # the build with ERR_CLOUD_CHECK_FAILED until the next index catches up. The
  # admin still builds against the live client; Tina Cloud indexes content on
  # its own schedule regardless.
  command = "cd artifacts/bmc-website && if [ -n \"$TINA_CLIENT_ID\" ]; then ./node_modules/.bin/tinacms build --skip-cloud-checks; else echo 'TINA_CLIENT_ID unset — skipping CMS admin build'; fi && node scripts/build.mjs"
  publish = "artifacts/bmc-website/dist/public"

[build.environment]
  NODE_VERSION = "22"

  # Your lockfile is out of sync with the `overrides` block in pnpm-workspace.yaml.
  # Netlify sets CI=true, which makes pnpm use --frozen-lockfile by default,
  # so without this the install fails before the build even starts.
  # strictDepBuilds=false stops the ignored esbuild build script from failing install.
  PNPM_FLAGS = "--no-frozen-lockfile --config.strictDepBuilds=false"

  # vite.config.ts throws if either of these is missing.
  BASE_PATH = "/"
  PORT = "5000"

# Static images/fonts under /assets don't have hashed filenames, so cache them for a
# week (not "immutable") — long enough to speed up repeat visits, short enough that a
# swapped-in file with the same name isn't stuck stale for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Redirects live in the generated dist/public/_redirects (scripts/prerender.mjs):
# clean URLs serve the prerendered pages, /admin goes to Tina, anything else gets 404.html
# with a real 404 status.

# Security headers on every response. frame-ancestors/SAMEORIGIN (not DENY) so Tina's
# admin can preview pages if visual editing is turned on later.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Content-Security-Policy on the public pages only. /admin (Tina) loads from Tina Cloud
# and is left out so editing keeps working.
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src https://docs.google.com https://forms.gle; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/about"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src https://docs.google.com https://forms.gle; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

